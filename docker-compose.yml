services: 
  # for teaching nginx reverse proxy 
  nginx: 
    image: nginx:alpine 
    container_name: nginx-proxy 
    ports:
      - 3000:80 
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - reactjs-svc
      #- restful-api
    networks:
      - fullstack-net
  reactjs-svc: 
    build: 
      context: . 
      dockerfile: dev.Dockerfile 
      #dockerfile: Dockerfile
    # ports:
    #   - "3000:3000"
    container_name: reactjs-cont 
    networks:
      - fullstack-net 
networks:
  fullstack-net: 
    name: fullstack-net
    external: true 